<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CarRace</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #87ceeb;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.165.0/build/three.module.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.1,
      5000
    );
    const CAMERA_HEIGHT = 6;
    const CAMERA_DISTANCE = 14;
    const CAMERA_HEIGHT_OFFSET = 0.5;
    const CAMERA_LOOK_AHEAD = 10;
    camera.position.set(0, CAMERA_HEIGHT, CAMERA_DISTANCE);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const ROAD_WIDTH = 10;
    const ROAD_SEGMENT_LENGTH = 250;
    const ROAD_SEGMENT_COUNT = 2;
    const ROAD_LOOP_LENGTH = ROAD_SEGMENT_LENGTH * ROAD_SEGMENT_COUNT;
    const roadSegments = [];
    for (let i = 0; i < ROAD_SEGMENT_COUNT; i++) {
      const segment = new THREE.Mesh(
        new THREE.PlaneGeometry(ROAD_WIDTH, ROAD_SEGMENT_LENGTH),
        new THREE.MeshStandardMaterial({ color: 0x2d2d2d })
      );
      segment.rotation.x = -Math.PI / 2;
      segment.position.y = 0;
      segment.position.z = -i * ROAD_SEGMENT_LENGTH;
      roadSegments.push(segment);
      scene.add(segment);
    }

    const laneMarkings = new THREE.Group();
    const markGeometry = new THREE.BoxGeometry(0.3, 0.02, 4);
    const markMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff });
    const laneMarkingsList = [];
    for (let z = ROAD_SEGMENT_LENGTH / 2; z > -ROAD_SEGMENT_LENGTH * 1.5; z -= 10) {
      const mark = new THREE.Mesh(markGeometry, markMaterial);
      mark.position.set(0, 0.02, z);
      laneMarkings.add(mark);
      laneMarkingsList.push(mark);
    }
    scene.add(laneMarkings);

    const car = new THREE.Mesh(
      new THREE.BoxGeometry(1.8, 1, 3.5),
      new THREE.MeshStandardMaterial({ color: 0xff3333 })
    );
    car.position.set(0, 0.6, 4);
    scene.add(car);

    let speed = 0;
    const acceleration = 0.01;
    const maxSpeed = 0.9;

    function animate() {
      requestAnimationFrame(animate);

      speed = Math.min(maxSpeed, speed + acceleration);
      const travel = speed;

      for (const segment of roadSegments) {
        segment.position.z += travel;
        if (segment.position.z > ROAD_SEGMENT_LENGTH / 2) {
          segment.position.z -= ROAD_LOOP_LENGTH;
        }
      }

      for (const mark of laneMarkingsList) {
        mark.position.z += travel;
        if (mark.position.z > ROAD_SEGMENT_LENGTH / 2) {
          mark.position.z -= ROAD_LOOP_LENGTH;
        }
      }

      camera.position.z = car.position.z + CAMERA_DISTANCE;
      camera.lookAt(
        car.position.x,
        car.position.y + CAMERA_HEIGHT_OFFSET,
        car.position.z - CAMERA_LOOK_AHEAD
      );

      renderer.render(scene, camera);
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
