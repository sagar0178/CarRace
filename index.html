<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CarRace</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #87ceeb;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.165.0/build/three.module.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.1,
      5000
    );
    camera.position.set(0, 6, 14);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const roadLength = 2000;
    const road = new THREE.Mesh(
      new THREE.PlaneGeometry(10, roadLength),
      new THREE.MeshStandardMaterial({ color: 0x2d2d2d })
    );
    road.rotation.x = -Math.PI / 2;
    road.position.y = 0;
    road.position.z = -roadLength / 2 + 20;
    scene.add(road);

    const laneMarkings = new THREE.Group();
    const markGeometry = new THREE.BoxGeometry(0.3, 0.02, 4);
    const markMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff });
    for (let z = 10; z > -roadLength + 20; z -= 10) {
      const mark = new THREE.Mesh(markGeometry, markMaterial);
      mark.position.set(0, 0.02, z);
      laneMarkings.add(mark);
    }
    scene.add(laneMarkings);

    const car = new THREE.Mesh(
      new THREE.BoxGeometry(1.8, 1, 3.5),
      new THREE.MeshStandardMaterial({ color: 0xff3333 })
    );
    car.position.set(0, 0.6, 4);
    scene.add(car);

    let speed = 0;
    const acceleration = 0.01;
    const maxSpeed = 0.9;

    function animate() {
      requestAnimationFrame(animate);

      speed = Math.min(maxSpeed, speed + acceleration);
      car.position.z -= speed;

      camera.position.z = car.position.z + 14;
      camera.lookAt(car.position.x, car.position.y + 0.5, car.position.z - 10);

      renderer.render(scene, camera);
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
